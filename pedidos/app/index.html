<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PediVoy App (Demo)</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f6f7fb;color:#16181d}
    .wrap{max-width:980px;margin:0 auto;padding:16px}
    .card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 6px 24px rgba(0,0,0,.06)}
    h1,h2{margin:0 0 10px}
    input,button{font-size:16px;padding:10px;border-radius:10px;border:1px solid #d7d9e0}
    button{background:#111;color:#fff;border:none;cursor:pointer}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .row>*{flex:1}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
    .prod{border:1px solid #eceef4;border-radius:10px;padding:10px}
    .muted{color:#61657a}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>PediVoy App (Demo)</h1>
    <p class="muted">Login con celular + código OTP.</p>

    <section class="card" id="step-login">
      <h2>1) Ingreso</h2>
      <div class="row" style="margin-bottom:8px">
        <button id="btn-google">Continuar con Google</button>
      </div>
      <p class="muted" style="margin:6px 0">o con tu celular:</p>
      <div class="row">
        <input id="telefono" placeholder="Ej: +5493511234567" />
        <button id="btn-otp">Enviar código</button>
      </div>
      <small class="muted" id="otp-debug"></small>
    </section>

    <section class="card hidden" id="step-code">
      <h2>2) Código</h2>
      <div class="row">
        <input id="code" placeholder="6 dígitos" />
        <button id="btn-verify">Validar</button>
      </div>
    </section>

    <section class="card hidden" id="step-profile">
      <h2>3) Tus datos</h2>
      <div class="row">
        <input id="cliente" placeholder="Nombre" />
        <input id="direccion" placeholder="Dirección" />
      </div>
      <div class="row" style="margin-top:8px">
        <input id="telefono-perfil" placeholder="Teléfono para pedidos" />
        <button id="btn-save-profile">Guardar perfil</button>
      </div>
      <small class="muted" id="profile-msg"></small>
    </section>

    <section class="card hidden" id="step-catalog">
      <h2>Catálogo</h2>
      <div class="grid" id="productos"></div>
    </section>

    <section class="card hidden" id="step-cart">
      <h2>Carrito</h2>
      <div id="cart"></div>
      <p><strong>Total:</strong> <span id="total">$0</span></p>
      <button id="btn-send">Enviar pedido</button>
    </section>

    <section class="card hidden" id="step-orders">
      <h2>Mis pedidos</h2>
      <button id="btn-refresh-orders" style="margin-bottom:8px">Actualizar</button>
      <div id="order-alert" class="hidden" style="margin:8px 0;padding:10px;border-radius:10px;background:#e8f0fe;color:#174ea6;font-weight:600"></div>
      <div id="orders" class="muted">Sin pedidos aún.</div>
    </section>
  </div>

  <script src="./main.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login – MultiEmpresas</title>
  
  <style>
    :root {
      --bg: #0b1020;
      --ink: #f1f5f9;
      --muted: #94a3b8;
      --brand: #06b6d4;
      --brand-hover: #22d3ee;
      --surface: rgba(30, 41, 59, 0.6);
      --border: rgba(148, 163, 184, 0.15);
      --glass: rgba(15, 23, 42, 0.75);
      --radius: 16px;
      
      --danger: #ef4444;
    }

    * { box-sizing: border-box; outline: none; }
    
    body {
      margin: 0; padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: 
        radial-gradient(circle at 20% 30%, rgba(6, 182, 212, 0.15), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.15), transparent 40%),
        var(--bg);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }

    /* CARD LOGIN */
    .login-card {
      width: 100%; max-width: 420px; margin: 20px;
      background: var(--surface); backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative; overflow: hidden;
    }
    
    /* Branding */
    .brand { text-align: center; margin-bottom: 2rem; }
    .brand svg { width: 48px; height: 48px; fill: var(--brand); margin-bottom: 1rem; filter: drop-shadow(0 0 10px rgba(6,182,212,0.4)); }
    .brand h2 { margin: 0; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; color: #fff; }
    .brand p { margin: 0.5rem 0 0; color: var(--muted); font-size: 0.95rem; }

    /* Form */
    form { display: flex; flex-direction: column; gap: 1.2rem; }
    
    label { font-size: 0.85rem; color: var(--muted); font-weight: 600; margin-bottom: 0.4rem; display: block; }
    
    .input-group { position: relative; }
    
    input {
      width: 100%; background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border); color: #fff;
      padding: 0.8rem 1rem; border-radius: 10px; font-size: 1rem; transition: 0.2s;
    }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(6,182,212,0.15); background: rgba(15, 23, 42, 0.9); }
    
    /* Toggle Password */
    .toggle-pwd {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: transparent; border: none; color: var(--muted);
      cursor: pointer; font-size: 0.8rem; font-weight: 600;
      padding: 4px 8px; border-radius: 6px; transition: 0.2s;
    }
    .toggle-pwd:hover { color: var(--brand); background: rgba(255,255,255,0.05); }

    /* Options Row */
    .options { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--muted); user-select: none; }
    .checkbox-label input { width: 16px; height: 16px; margin: 0; accent-color: var(--brand); cursor: pointer; }
    .forgot-link { color: var(--brand); text-decoration: none; font-weight: 500; transition: 0.2s; }
    .forgot-link:hover { color: var(--brand-hover); text-decoration: underline; }

    /* Submit Button */
    button[type="submit"] {
      background: var(--brand); color: #0f172a; border: none;
      padding: 0.9rem; border-radius: 10px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: 0.2s; margin-top: 0.5rem;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
    }
    button[type="submit"]:hover { background: var(--brand-hover); transform: translateY(-1px); }
    button[type="submit"]:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    /* Error Message */
    .err-msg {
      background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5; padding: 0.8rem; border-radius: 8px; font-size: 0.9rem;
      text-align: center; display: none; animation: shake 0.3s ease-in-out;
    }
    @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }

    /* Footer & Signup Link */
    .signup-area {
      text-align: center; margin-top: 1.5rem; padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    .btn-signup {
      display: inline-block; margin-top: 0.5rem;
      text-decoration: none; color: var(--brand); 
      border: 1px solid var(--brand); padding: 0.6rem 1.2rem; 
      border-radius: 8px; font-weight: 600; font-size: 0.9rem; 
      transition: 0.2s;
    }
    .btn-signup:hover { background: rgba(6, 182, 212, 0.1); transform: translateY(-1px); }

    .footer-note { text-align: center; margin-top: 1.5rem; color: var(--muted); font-size: 0.8rem; opacity: 0.5; }

  </style>
</head>
<body>

  <main class="login-card">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M12 2C8 2 6 6 6 9c0 4 6 13 6 13s6-9 6-13c0-3-2-7-6-7Zm0 9a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/></svg>
      <h2>Bienvenido</h2>
      <p>Ingresá tus credenciales para continuar</p>
    </div>

    <div id="err" class="err-msg"></div>

    <form id="fLogin">
      <div>
        <label>Usuario</label>
        <input id="username" name="username" type="text" placeholder="Ej: admin" autocomplete="username" required autofocus />
      </div>
      
      <div>
        <label>Contraseña</label>
        <div class="input-group">
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
          <button type="button" id="togglePwd" class="toggle-pwd">Ver</button>
        </div>
      </div>

      <div class="options">
        <label class="checkbox-label">
          <input type="checkbox" id="remember" />
          <span>Recordarme</span>
        </label>
        <a href="mailto:soporte@tuapp.com" class="forgot-link">¿Ayuda?</a>
      </div>

      <button id="btnLogin" type="submit">Iniciar Sesión</button>
    </form>

    <div class="signup-area">
      <p style="color:var(--muted); font-size:0.9rem; margin:0;">¿Querés vender con nuestro sistema?</p>
      <a href="signup.html" class="btn-signup">
        🚀 Crear Empresa Gratis
      </a>
    </div>

    <div class="footer-note">
      Sistema MultiEmpresas v2.0 • Acceso seguro
    </div>
  </main>

  <script>
    const $ = s => document.querySelector(s);
    
    // UI Refs
    const f = $('#fLogin');
    const user = $('#username');
    const pass = $('#password');
    const btn = $('#btnLogin');
    const err = $('#err');
    const remember = $('#remember');
    const toggleBtn = $('#togglePwd');

    // --- Init ---
    (async function boot(){
      // Limpieza preventiva si venimos de logout explícito
      if(location.pathname.includes('login.html')) {
        // No borramos localStorage completo para mantener 'lastUsername'
        localStorage.removeItem('token'); 
      }

      // Cargar usuario recordado
      const lastUser = localStorage.getItem('lastUsername');
      if(lastUser) {
        user.value = lastUser;
        remember.checked = true;
      }

      // Check sesión existente
      const token = localStorage.getItem('token');
      if(token) {
        try {
          const r = await fetch('/api/me', { headers:{ Authorization:'Bearer '+token }});
          if(r.ok) {
            const d = await r.json();
            redirectByRole(d?.user?.role);
          }
        } catch {}
      }
    })();

    // --- Logic ---
    toggleBtn.onclick = () => {
      const isPass = pass.type === 'password';
      pass.type = isPass ? 'text' : 'password';
      toggleBtn.textContent = isPass ? 'Ocultar' : 'Ver';
    };

    f.onsubmit = async (e) => {
      e.preventDefault();
      setLoading(true);
      showError(null);

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ 
            username: user.value.trim(), 
            password: pass.value 
          })
        });

        const data = await res.json();

        // Manejo de errores específicos
        if(!res.ok) {
            // Si es un error de "Licencia vencida" (402 o 403 con mensaje específico)
            if (res.status === 402 || (data.error && data.error.includes('finalizado'))) {
                throw new Error('⏳ Tu periodo de prueba ha finalizado. Contacta a soporte.');
            }
            throw new Error(data.error || 'Credenciales incorrectas');
        }
        
        if(!data.token) throw new Error('Error de servidor: Sin token');

        // Éxito
        localStorage.setItem('token', data.token);
        
        if(remember.checked) localStorage.setItem('lastUsername', user.value.trim());
        else localStorage.removeItem('lastUsername');

        // Redirección inteligente
        const next = new URLSearchParams(location.search).get('next');
        if(next) location.href = next;
        else redirectByRole(readRole(data.token));

      } catch(e) {
        showError(e.message);
        pass.value = '';
        pass.focus();
      } finally {
        setLoading(false);
      }
    };

    // --- Helpers ---
    function redirectByRole(role) {
      role = String(role||'').toLowerCase();
      if(role === 'repartidor') location.href = 'repartidor.html'; // Dashboard móvil
      else location.href = 'dashboard.html'; // Dashboard admin/super
    }

    function readRole(token) {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        return payload.role;
      } catch { return 'user'; }
    }

    function setLoading(isLoading) {
      btn.disabled = isLoading;
      btn.innerHTML = isLoading ? '<span style="animation:spin 1s linear infinite">⏳</span> Validando...' : 'Iniciar Sesión';
      user.disabled = isLoading;
      pass.disabled = isLoading;
    }

    function showError(msg) {
      if(!msg) {
        err.style.display = 'none';
        return;
      }
      err.textContent = '⚠️ ' + msg;
      err.style.display = 'block';
    }

  </script>
</body>
</html>

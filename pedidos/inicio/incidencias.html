<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Incidencias Operativas</title>
  <style>
    :root{--bg:#0b1020;--bg2:#0f172a;--ink:#f1f5f9;--muted:#94a3b8;--brand:#06b6d4;--border:rgba(148,163,184,.18);--danger:#ef4444}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui}
    .container{max-width:1240px;margin:0 auto;padding:0 20px}
    header{position:sticky;top:0;background:rgba(15,23,42,.95);border-bottom:1px solid var(--border);padding:.8rem 0}
    .menu{display:flex;gap:1rem;list-style:none;margin:0;padding:0}.menu a{color:var(--muted);text-decoration:none}.menu a.active,.menu a:hover{color:#fff}
    .card{background:rgba(30,41,59,.7);border:1px solid var(--border);border-radius:12px;padding:14px;margin:12px 0}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
    .kpi{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px}.kpi .l{font-size:.75rem;color:var(--muted);text-transform:uppercase}.kpi .v{font-size:1.2rem;font-weight:700}
    input,select,textarea,button{background:var(--bg2);border:1px solid var(--border);color:#fff;border-radius:8px;padding:8px 10px}button{cursor:pointer}.primary{background:var(--brand);color:#001018;border:none;font-weight:700}
    table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--border);font-size:.9rem}th{color:var(--muted);text-align:left}
    .modal{position:fixed;inset:0;background:rgba(2,6,23,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
    .modal.open{display:flex}.modal-card{width:min(680px,96vw);background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px}
  </style>
</head>
<body>
  <header>
    <div class="container" style="display:flex;justify-content:space-between;align-items:center">
      <div><strong>MultiEmpresas</strong> <span id="roleBadge" style="font-size:.75rem;color:var(--brand)">Admin</span></div>
      <ul class="menu"><li><a href="inicial.html">🚀 Inicio</a></li><li><a href="ejecutivo.html">Ejecutivo</a></li><li><a href="incidencias.html" class="active">Incidencias</a></li><li><a href="#" id="logout" style="color:var(--danger)">Salir</a></li></ul>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h1 style="margin:0;font-size:1.2rem">Fase 3 · Centro de incidencias</h1>
        <div class="row"><div id="empresaWrap" style="display:none"><select id="empresaSelect"><option value="">Seleccionar empresa…</option></select></div><button id="btnRefresh">Actualizar</button></div>
      </div>
      <div id="status" style="margin-top:6px;color:var(--muted)">Listo.</div>
    </div>

    <div class="card"><h2 style="margin:0 0 8px;font-size:1rem">KPI incidencias</h2><div id="kpiGrid" class="grid"></div></div>
    <div class="card"><h2 style="margin:0 0 8px;font-size:1rem">Alertas SLA / críticas</h2><div id="incAlertas" style="display:grid;gap:8px"></div></div>

    <div class="card">
      <h2 style="margin:0 0 8px;font-size:1rem">Nueva incidencia</h2>
      <div class="row">
        <select id="incTipo"><option value="entrega">Entrega</option><option value="cobranza">Cobranza</option><option value="producto">Producto</option><option value="cliente">Cliente</option><option value="sistema">Sistema</option></select>
        <select id="incSev"><option value="media">Media</option><option value="alta">Alta</option><option value="critica">Crítica</option><option value="baja">Baja</option></select>
        <input id="incTitulo" placeholder="Título" style="min-width:240px" />
        <input id="incAccion" placeholder="Acción recomendada" style="min-width:260px" />
        <select id="incResp" style="min-width:220px"></select>
        <input id="incVence" type="datetime-local" style="min-width:220px" />
        <button id="btnAdd" class="primary">Crear</button>
      </div>
      <div class="row" style="margin-top:8px"><textarea id="incDetalle" rows="2" placeholder="Detalle" style="width:100%"></textarea></div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 8px;font-size:1rem">Bandeja</h2>
      <div class="row" style="margin-bottom:8px"><select id="fltEstado"><option value="">Estado: todos</option><option value="abierta">Abierta</option><option value="en_progreso">En progreso</option><option value="resuelta">Resuelta</option><option value="cancelada">Cancelada</option></select><select id="fltSev"><option value="">Severidad: todas</option><option value="critica">Crítica</option><option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option></select></div>
      <div style="overflow:auto"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Sev.</th><th>Estado</th><th>Título</th><th>Resp.</th><th>Vence</th><th>Acción</th><th></th></tr></thead><tbody id="incBody"></tbody></table></div>
    </div>
  </main>

  <div id="editModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <div class="row" style="justify-content:space-between"><h3 style="margin:0">Editar incidencia</h3><button id="editClose" type="button">Cerrar</button></div>
      <div class="row" style="margin-top:10px">
        <select id="editTipo"><option value="entrega">Entrega</option><option value="cobranza">Cobranza</option><option value="producto">Producto</option><option value="cliente">Cliente</option><option value="sistema">Sistema</option></select>
        <select id="editSev"><option value="media">Media</option><option value="alta">Alta</option><option value="critica">Crítica</option><option value="baja">Baja</option></select>
        <select id="editEstado"><option value="abierta">Abierta</option><option value="en_progreso">En progreso</option><option value="resuelta">Resuelta</option><option value="cancelada">Cancelada</option></select>
      </div>
      <div class="row" style="margin-top:8px"><input id="editTitulo" placeholder="Título" style="flex:1" /></div>
      <div class="row" style="margin-top:8px"><input id="editAccion" placeholder="Acción recomendada" style="flex:1" /><select id="editResp" style="min-width:220px"></select><input id="editVence" type="datetime-local" style="min-width:220px" /></div>
      <div class="row" style="margin-top:8px"><textarea id="editDetalle" rows="3" placeholder="Detalle" style="width:100%"></textarea></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button id="editSave" class="primary" type="button">Guardar cambios</button></div>
    </div>
  </div>

  <script>
    const authFetch=(url,opts={})=>fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})},credentials:'include'});
    const st={isSuper:false,empresaId:null,items:[],users:[],editingId:null};
    const setStatus=(t,e=false)=>{const el=document.getElementById('status');el.textContent=t;el.style.color=e?'var(--danger)':'var(--muted)';};
    const apiUrl=(p)=>st.isSuper&&st.empresaId?(p+(p.includes('?')?'&':'?')+'empresa_id='+encodeURIComponent(String(st.empresaId))):p;
    const editModal=document.getElementById('editModal');

    function toLocalInput(iso){ if(!iso) return ''; const d=new Date(iso); const pad=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }

    async function loadMe(){
      const r=await authFetch('/api/me'); if(r.status===401) return location.href='/pedidos/login.html';
      const me=await r.json(); st.isSuper=String(me?.user?.role||'').toLowerCase()==='super'; st.empresaId=me?.user?.empresa_id||null;
      document.getElementById('roleBadge').textContent=st.isSuper?'SUPER ADMIN':'Admin';
      if(st.isSuper){ st.empresaId=null; const wrap=document.getElementById('empresaWrap');wrap.style.display='block'; const sel=document.getElementById('empresaSelect'); let list=[]; const r1=await authFetch('/api/admin/empresas-list'); if(r1.ok){const j=await r1.json().catch(()=>[]); list=Array.isArray(j)?j:(Array.isArray(j.data)?j.data:[]);} if(!list.length){const r2=await authFetch('/api/empresas'); if(r2.ok){const j2=await r2.json().catch(()=>[]); list=Array.isArray(j2)?j2:(Array.isArray(j2.data)?j2.data:[]);} } sel.innerHTML='<option value="">Seleccionar empresa</option>'; list.forEach(e=>{const o=document.createElement('option');o.value=String(Number(e.id)||'');o.textContent=`${e.id} · ${e.nombre}`;sel.appendChild(o);}); sel.addEventListener('change',()=>{st.empresaId=sel.value?Number(sel.value):null; refreshAll();}); }
    }

    async function loadUsers(){
      if(st.isSuper&&!st.empresaId) return;
      const r=await authFetch(apiUrl('/api/setup/fase3/usuarios')); const j=await r.json(); if(!r.ok) throw new Error(j.error||'Error usuarios');
      st.users=Array.isArray(j.items)?j.items:[];
      const opts='<option value="">Sin responsable</option>'+st.users.map(u=>`<option value="${Number(u.id)}">${u.username} (${u.role})</option>`).join('');
      document.getElementById('incResp').innerHTML=opts;
      document.getElementById('editResp').innerHTML=opts;
    }

    async function loadKpis(){ if(st.isSuper&&!st.empresaId) return; const r=await authFetch(apiUrl('/api/setup/fase3/incidencias/dashboard')); const j=await r.json(); if(!r.ok) throw new Error(j.error||'Error KPI incidencias'); const k=j.kpis||{}; document.getElementById('kpiGrid').innerHTML=[['Total',k.total||0],['Abiertas',k.abiertas||0],['En progreso',k.en_progreso||0],['Resueltas',k.resueltas||0],['Críticas activas',k.criticas_activas||0],['SLA vencidas',k.sla_vencidas||0]].map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join(''); }
    async function loadAlertas(){ if(st.isSuper&&!st.empresaId) return; const r=await authFetch(apiUrl('/api/setup/fase3/incidencias/alertas')); const j=await r.json(); if(!r.ok) throw new Error(j.error||'Error alertas incidencias'); const items=Array.isArray(j.items)?j.items:[]; const color=(n)=>n==='alta'?'#ef4444':(n==='media'?'#f59e0b':'#22c55e'); document.getElementById('incAlertas').innerHTML=items.map(a=>`<div style="border:1px solid var(--border);border-left:4px solid ${color(a.nivel)};border-radius:10px;padding:10px;background:var(--bg2)"><div style="font-weight:700">${a.titulo}</div><div style="font-size:.9rem;color:var(--muted)">${a.detalle||''}</div></div>`).join(''); }

    async function loadInc(){
      if(st.isSuper&&!st.empresaId) return;
      const fltEstado=document.getElementById('fltEstado').value||''; const fltSev=document.getElementById('fltSev').value||'';
      let path='/api/setup/fase3/incidencias'; const params=new URLSearchParams(); if(fltEstado) params.set('estado',fltEstado); if(fltSev) params.set('severidad',fltSev); if(params.toString()) path += '?' + params.toString();
      const r=await authFetch(apiUrl(path)); const j=await r.json(); if(!r.ok) throw new Error(j.error||'Error incidencias');
      st.items=Array.isArray(j.items)?j.items:[];
      const body=document.getElementById('incBody');
      body.innerHTML=st.items.length?st.items.map(x=>`<tr><td>${x.created_at?new Date(x.created_at).toLocaleDateString('es-AR'):'-'}</td><td>${x.tipo||'-'}</td><td>${x.severidad||'-'}</td><td>${x.estado||'-'}</td><td>${x.titulo||'-'}</td><td>${x.responsable_nombre||'-'}</td><td>${x.vence_at?new Date(x.vence_at).toLocaleString('es-AR'):'-'}</td><td>${x.accion_recomendada||'-'}</td><td><button type="button" data-action="edit" data-id="${Number(x.id)}">Editar</button></td></tr>`).join(''):'<tr><td colspan="9" style="color:var(--muted)">Sin incidencias.</td></tr>';
    }

    function openEdit(item){
      st.editingId=Number(item.id);
      document.getElementById('editTipo').value=item.tipo||'entrega';
      document.getElementById('editSev').value=item.severidad||'media';
      document.getElementById('editEstado').value=item.estado||'abierta';
      document.getElementById('editTitulo').value=item.titulo||'';
      document.getElementById('editDetalle').value=item.detalle||'';
      document.getElementById('editAccion').value=item.accion_recomendada||'';
      document.getElementById('editResp').value=item.responsable_usuario_id?String(Number(item.responsable_usuario_id)):'';
      document.getElementById('editVence').value=toLocalInput(item.vence_at);
      editModal.classList.add('open'); editModal.setAttribute('aria-hidden','false');
    }
    function closeEdit(){ st.editingId=null; editModal.classList.remove('open'); editModal.setAttribute('aria-hidden','true'); }

    async function refreshAll(){
      if(st.isSuper&&!st.empresaId){ setStatus('Seleccioná una empresa para cargar incidencias.',true); ['kpiGrid','incBody','incAlertas'].forEach(id=>{const el=document.getElementById(id); if(el) el.innerHTML='';}); return; }
      setStatus('Actualizando…');
      try{ await Promise.all([loadUsers(),loadKpis(),loadAlertas(),loadInc()]); setStatus('Actualizado.'); }
      catch(e){ setStatus(e.message||'Error',true); }
    }

    document.getElementById('btnAdd').addEventListener('click', async ()=>{
      if(st.isSuper&&!st.empresaId) return setStatus('Seleccioná empresa primero',true);
      const body={ tipo:document.getElementById('incTipo').value, severidad:document.getElementById('incSev').value, titulo:document.getElementById('incTitulo').value.trim(), detalle:document.getElementById('incDetalle').value.trim()||null, accion_recomendada:document.getElementById('incAccion').value.trim()||null, responsable_usuario_id:Number(document.getElementById('incResp').value||0)||null, vence_at:document.getElementById('incVence').value?new Date(document.getElementById('incVence').value).toISOString():null };
      if(!body.titulo) return setStatus('Título requerido',true);
      if(st.isSuper) body.empresa_id=st.empresaId;
      const r=await authFetch('/api/setup/fase3/incidencias',{method:'POST',body:JSON.stringify(body)}); const j=await r.json(); if(!r.ok) return setStatus(j.error||'No se pudo crear incidencia',true);
      document.getElementById('incTitulo').value=''; document.getElementById('incDetalle').value=''; document.getElementById('incAccion').value=''; document.getElementById('incResp').value=''; document.getElementById('incVence').value='';
      refreshAll();
    });

    document.getElementById('incBody').addEventListener('click', (ev)=>{ const btn=ev.target.closest('button[data-action="edit"][data-id]'); if(!btn) return; const id=Number(btn.getAttribute('data-id')); const item=st.items.find(x=>Number(x.id)===id); if(!item) return; openEdit(item); });
    document.getElementById('editClose').addEventListener('click', closeEdit);
    editModal.addEventListener('click', (ev)=>{ if(ev.target===editModal) closeEdit(); });

    document.getElementById('editSave').addEventListener('click', async ()=>{
      const id=Number(st.editingId); if(!Number.isFinite(id)||id<=0) return;
      const body={ tipo:document.getElementById('editTipo').value, severidad:document.getElementById('editSev').value, estado:document.getElementById('editEstado').value, titulo:document.getElementById('editTitulo').value.trim(), detalle:document.getElementById('editDetalle').value.trim()||null, accion_recomendada:document.getElementById('editAccion').value.trim()||null, responsable_usuario_id:Number(document.getElementById('editResp').value||0)||null, vence_at:document.getElementById('editVence').value?new Date(document.getElementById('editVence').value).toISOString():null };
      if(!body.titulo) return setStatus('Título requerido',true);
      if(st.isSuper) body.empresa_id=st.empresaId;
      const r=await authFetch(`/api/setup/fase3/incidencias/${id}`,{method:'PUT',body:JSON.stringify(body)}); const j=await r.json(); if(!r.ok) return setStatus(j.error||'No se pudo guardar incidencia',true);
      closeEdit(); setStatus('Incidencia actualizada.'); refreshAll();
    });

    document.getElementById('fltEstado').addEventListener('change', loadInc);
    document.getElementById('fltSev').addEventListener('change', loadInc);
    document.getElementById('btnRefresh').addEventListener('click',refreshAll);
    document.getElementById('logout').addEventListener('click', async (e)=>{e.preventDefault(); try{await authFetch('/api/logout',{method:'POST'});}catch{} location.href='/pedidos/login.html';});

    (async()=>{ await loadMe(); await refreshAll(); })();
  </script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Promociones y Puntos – MultiEmpresas</title>
  <link rel="stylesheet" href="theme-base.css" />
  <style>
    :root {
      --bg: #0b1020;
      --bg-2: #0f172a;
      --ink: #f1f5f9;
      --muted: #94a3b8;
      --brand: #06b6d4;
      --brand-hover: #22d3ee;
      --surface: rgba(30, 41, 59, 0.7);
      --border: rgba(148, 163, 184, 0.15);
      --glass: rgba(15, 23, 42, 0.95);
      --radius: 12px;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 50%, rgba(6, 182, 212, 0.05), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.05), transparent 25%),
        var(--bg);
      min-height: 100vh;
      font-size: 14px;
      padding-bottom: 80px;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--glass);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.8rem 0;
    }

    nav { display: flex; justify-content: space-between; align-items: center; }

    .brand {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      white-space: nowrap;
    }

    .brand-dot { width: 10px; height: 10px; background: var(--brand); border-radius: 50%; box-shadow: 0 0 10px var(--brand); }

    .role-badge {
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.3);
      color: var(--brand);
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 0.75rem;
    }

    .menu { list-style: none; display: flex; gap: 1.5rem; margin: 0; padding: 0; }
    .menu a { text-decoration: none; color: var(--muted); font-weight: 500; transition: 0.2s; white-space: nowrap; }
    .menu a:hover, .menu a.active { color: #fff; }
    .menu a.active { border-bottom: 2px solid var(--brand); padding-bottom: 4px; }

    @media (max-width: 768px) {
      nav { flex-direction: column; gap: 1rem; align-items: stretch; }
      .brand { justify-content: space-between; }
      .menu { overflow-x: auto; padding-bottom: 5px; gap: 20px; }
      .menu::-webkit-scrollbar { display: none; }
    }

    main { padding-top: 2rem; padding-bottom: 4rem; display: flex; flex-direction: column; gap: 1.5rem; }

    .page-header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 1rem; }
    h1 { font-size: 1.8rem; margin: 0; color: #fff; display: flex; align-items: center; gap: 10px; line-height: 1.2; }
    p.subtitle { color: var(--muted); margin: 0.5rem 0 0 0; font-size: 0.95rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .grid { display: grid; gap: 12px; }
    .g4 { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }

    .kpi { background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
    .kpi .v { font-size: 1.3rem; font-weight: 700; }

    label {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 700;
      display: block;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-2);
      color: #fff;
      font-size: 0.95rem;
    }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn {
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      background: rgba(255,255,255,0.05);
      color: var(--ink);
      border-color: var(--border);
      text-decoration: none;
      white-space: nowrap;
      justify-content: center;
    }

    .btn:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: var(--brand); }
    .btn.primary { background: var(--brand); color: #000; border: none; font-weight: 700; }
    .btn.primary:hover { background: var(--brand-hover); box-shadow: 0 4px 12px rgba(6,182,212,.3); }

    .table-responsive { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-2); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th {
      background: rgba(15, 23, 42, 0.9);
      color: var(--muted);
      font-weight: 600;
      padding: 1rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td { padding: 1rem; border-bottom: 1px solid var(--border); color: var(--ink); font-size: 0.9rem; vertical-align: middle; white-space: nowrap; }

    .muted { color: var(--muted); }

    @media (max-width: 600px) {
      .row { grid-template-columns: 1fr; }
      .page-header { flex-direction: column; align-items: stretch; }
      .page-header .btn { width: 100%; }
    }
    .pedivoy-brand-logo{display:inline-block;width:auto;height:32px;max-width:150px;object-fit:contain;vertical-align:middle;flex:0 0 auto}.brand .pedivoy-brand-logo{height:32px}.pedivoy-brand-badge{position:fixed;top:12px;left:12px;z-index:1000;display:inline-flex;align-items:center;padding:7px 10px;border-radius:10px;background:rgba(15,23,42,.82);border:1px solid rgba(148,163,184,.22);box-shadow:0 10px 30px rgba(2,8,23,.25);backdrop-filter:blur(10px)}.pedivoy-brand-badge img{height:28px;width:auto;display:block}
</style>
</head>
<body>
  <header>
    <nav class="container">
      <div class="brand">
        <img class="pedivoy-brand-logo" src="../img/brand/pedivoy-logo-horizontal-white.png" alt="PediVoy">
        MultiEmpresas
        <span id="roleBadge" class="role-badge"></span>
      </div>
      <ul class="menu">
        <li><a href="inicial.html">🚀 Inicio</a></li>
        <li><a href="/pedidos/dashboard.html">Dashboard</a></li>
        <li><a href="producto.html">Productos</a></li>
        <li><a href="promociones.html" class="active">Promociones</a></li>
        <li><a href="comando.html">Comando</a></li>
        <li><a href="#" id="logout" style="color:var(--danger)">Salir</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="page-header">
      <div>
        <h1>🎯 Promociones y Puntos</h1>
        <p class="subtitle">Métricas, configuración de puntos y promos activas por producto.</p>
      </div>
    </div>

    <div class="card grid g4" id="kpis"></div>

    <div class="card">
      <h3 style="margin-top:0">Configuración general (Puntos)</h3>
      <div id="empWrap" style="display:none;margin-bottom:10px">
        <label>Empresa</label>
        <select id="empSel"><option value="">-- Seleccionar Empresa --</option></select>
      </div>
      <div class="row">
        <div><label>Programa activo</label><select id="points_enabled"><option value="1">Sí</option><option value="0">No</option></select></div>
        <div><label>Puntos por pedido entregado</label><input type="number" id="points_per_order" min="0" step="1"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <div><label>Puntos por cada $1.000</label><input type="number" id="points_per_1000" min="0" step="0.01"></div>
        <div><label>Mínimo puntos para canje</label><input type="number" id="min_redeem_points" min="0" step="1"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <div><label>Valor en $ por 1 punto</label><input type="number" id="value_per_point" min="0" step="0.01"></div>
        <div><label class="muted">Última actualización</label><div id="updatedAt" class="muted">-</div></div>
      </div>
      <div style="margin-top:12px"><button class="btn primary" id="btnSave">Guardar configuración</button></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Promos por producto</h3>
      <div class="table-responsive">
        <table>
          <thead><tr><th>Producto</th><th>Modo</th><th>Redenciones (30d)</th><th>Total</th><th></th></tr></thead>
          <tbody id="tbPromos"><tr><td colspan="5" class="muted">Cargando…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    let isSuper = false;

    async function api(url, opts = {}) {
      const res = await fetch(url, { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers||{}) }, credentials: 'include' });
      if (res.status === 401) { location.href = '../login.html'; return null; }
      return res.json();
    }

    function empresaQS() {
      const emp = $('#empSel')?.value;
      return (isSuper && emp) ? `?empresa_id=${encodeURIComponent(emp)}` : '';
    }

    function drawKpis(k){
      const items = [
        ['Promos activas', k.promos_activas],
        ['Con regalo', k.promos_con_regalo],
        ['Con descuento', k.promos_con_descuento],
        ['Redenciones 30d', k.redemptions_30d],
        ['Redenciones total', k.redemptions_total],
        ['Clientes únicos', k.unique_clients],
        ['Puntos emitidos 30d', k.points_issued_30d],
        ['Puntos emitidos total', k.points_issued_total],
      ];
      $('#kpis').innerHTML = items.map(([t,v]) => `<div class="kpi"><div class="muted">${t}</div><div class="v">${Number(v||0)}</div></div>`).join('');
    }

    async function loadDashboard(){
      const d = await api('/api/promociones/dashboard' + empresaQS());
      if (!d || d.error) return;
      drawKpis(d.kpis || {});
      const rows = Array.isArray(d.items) ? d.items : [];
      $('#tbPromos').innerHTML = rows.length ? rows.map(r => {
        const cfg = r.promo_config?.once_per_client_gift || {};
        return `<tr>
          <td>${r.nombre}</td>
          <td>${cfg.mode === 'global_client' ? 'Global cliente' : 'Por producto'}</td>
          <td>${Number(r.redemptions_30d||0)}</td>
          <td>${Number(r.redemptions_total||0)}</td>
          <td><a class="btn" href="producto.html">Editar</a></td>
        </tr>`;
      }).join('') : '<tr><td colspan="5" class="muted">No hay promos configuradas.</td></tr>';
    }

    async function loadConfig(){
      const c = await api('/api/promociones/config' + empresaQS());
      if (!c || c.error) return;
      const p = c.points_config || {};
      $('#points_enabled').value = p.enabled ? '1' : '0';
      $('#points_per_order').value = p.points_per_order ?? 10;
      $('#points_per_1000').value = p.points_per_1000 ?? 0;
      $('#min_redeem_points').value = p.min_redeem_points ?? 100;
      $('#value_per_point').value = p.value_per_point ?? 1;
      $('#updatedAt').textContent = c.updated_at ? new Date(c.updated_at).toLocaleString('es-AR') : '-';
    }

    async function saveConfig(){
      const body = {
        points_config: {
          enabled: $('#points_enabled').value === '1',
          points_per_order: Number($('#points_per_order').value || 0),
          points_per_1000: Number($('#points_per_1000').value || 0),
          min_redeem_points: Number($('#min_redeem_points').value || 0),
          value_per_point: Number($('#value_per_point').value || 0),
        }
      };
      const r = await api('/api/promociones/config' + empresaQS(), { method:'PUT', body: JSON.stringify(body) });
      if (r && !r.error) {
        alert('✅ Configuración guardada');
        loadConfig();
      }
    }

    async function init(){
      $('#logout')?.addEventListener('click', async (e) => { e.preventDefault(); try{ await api('/api/logout',{method:'POST'});}catch{} location.href='../login.html'; });
      $('#btnSave')?.addEventListener('click', saveConfig);

      const me = await api('/api/me');
      isSuper = (me?.user?.role || '').toLowerCase() === 'super';
      $('#roleBadge').textContent = isSuper ? 'SUPER ADMIN' : 'Admin';

      if (isSuper) {
        $('#empWrap').style.display = 'block';
        const list = await api('/api/empresas');
        const sel = $('#empSel');
        sel.innerHTML = '<option value="">-- Seleccionar Empresa --</option>' + (Array.isArray(list) ? list.map(e => `<option value="${Number(e.id)}">${e.nombre}</option>`).join('') : '');
        sel.addEventListener('change', async () => { await loadDashboard(); await loadConfig(); });
      }

      await loadDashboard();
      await loadConfig();
    }
    init();
  </script>
</body>
</html>

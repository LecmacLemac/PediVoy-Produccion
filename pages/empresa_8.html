<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuegin - Matafugo y Recarga de Gas</title>
    <meta name="description" content="Servicios de Matafugo y Recarga de Gas por Fuegin. Seguridad y calidad garantizadas.">
    <style>
        :root {
            --bg: #f5f8f7;
            --surface: #ffffff;
            --surface-2: #edf5f3;
            --ink: #142321;
            --muted: #64736f;
            --line: #d7e2df;
            --brand: #0b7a75;
            --brand-2: #55c2b8;
            --brand-3: #123b3a;
            --radius: 28px;
            --shadow: 0 20px 55px rgba(18, 59, 58, 0.1);
            --shadow-strong: 0 34px 85px rgba(18, 59, 58, 0.16);
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            font-family: Arial, sans-serif;
            color: var(--ink);
        }
        .wrap {
            width: min(1200px, 92%);
            margin: 0 auto;
        }
        header {
            background: var(--surface);
            padding: 10px 0;
            box-shadow: var(--shadow);
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            display: flex;
            align-items: center;
            font-weight: bold;
        }
        .brand-logo {
            height: 40px;
            margin-right: 10px;
        }
        nav a {
            margin: 0 10px;
            color: var(--ink);
            text-decoration: none;
        }
        .hero {
            background: var(--surface-2);
            padding: 40px 0;
            text-align: center;
        }
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .hero p {
            font-size: 1.2rem;
            color: var(--muted);
            margin-bottom: 20px;
        }
        .hero .btn {
            background: var(--brand);
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.3s;
        }
        .hero .btn:hover {
            background: var(--brand-2);
        }
        .products {
            padding: 40px 0;
        }
        .product-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow-strong);
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(18, 59, 58, 0.16);
        }
        .product-image {
            height: 200px;
            background-size: cover;
            background-position: center;
        }
        .product-info {
            padding: 20px;
        }
        .product-info h3 {
            margin: 0 0 10px;
            font-size: 1.5rem;
        }
        .product-info p {
            color: var(--muted);
            margin-bottom: 20px;
        }
        .product-price {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--brand-3);
        }
        .btn-primary {
            background: var(--brand);
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-primary:hover {
            background: var(--brand-2);
        }
        footer {
            background: var(--surface);
            padding: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <div class="wrap">
            <div class="navbar">
                <div class="brand">
                    Fuegin
                </div>
                <nav>
                    <a href="#home">Inicio</a>
                    <a href="#productos">Productos</a>
                    <a href="#contacto">Contacto</a>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="wrap">
                <h1>Fuegin - Matafugo y Recarga de Gas</h1>
                <p>Servicios de calidad en matafuego y recarga de gas para tu seguridad.</p>
                <button class="btn">Ver Productos</button>
            </div>
        </section>
        <section id="productos" class="products">
            <div class="wrap">
                <h2>Productos destacados</h2>
                <div id="productGrid" class="products-grid">
                    <!-- Productos se cargarán aquí -->
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="wrap">
            <p>&copy; 2023 Fuegin. Todos los derechos reservados.</p>
        </div>
    </footer>
    <script>
        const empresaId = 8;
        const FALLBACK_SVG_DATA_URI = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect width=%22200%22 height=%22200%22 fill=%22%23edf5f3%22/%3E%3C/svg%3E';

        async function fetchProductos() {
            try {
                const response = await fetch(`/api/public/productos?empresa_id=${empresaId}&scope=landing`);
                if (!response.ok) throw new Error('Error al cargar productos');
                const productos = await response.json();
                renderProductos(productos);
            } catch (error) {
                showToast('Error al cargar productos');
            }
        }

        function safeProductImage(value) {
            try {
                const url = new URL(String(value || ''), location.origin);
                if (value && ['https:', 'http:'].includes(url.protocol) && !url.username && !url.password) return url.href;
            } catch {}
            return FALLBACK_SVG_DATA_URI;
        }

        function renderProductos(productos) {
            const grid = document.getElementById('productGrid');
            grid.replaceChildren();
            if (!Array.isArray(productos) || !productos.length) {
                const empty = document.createElement('p');
                empty.textContent = 'No hay productos disponibles actualmente.';
                grid.append(empty);
                return;
            }
            [...productos].sort((a, b) => String(a.nombre || '').localeCompare(String(b.nombre || ''))).forEach(producto => {
                const card = document.createElement('a');
                card.className = 'product-card';
                const target = new URL('/pedidos/index.html', location.origin);
                target.searchParams.set('empresa_id', empresaId);
                target.searchParams.set('add', String(producto.id));
                card.href = target.href;
                const image = document.createElement('img');
                image.className = 'product-image';
                image.alt = String(producto.nombre || 'Producto');
                image.src = safeProductImage(producto.imagen_promo || producto.imagen);
                image.addEventListener('error', () => { image.src = FALLBACK_SVG_DATA_URI; }, { once: true });
                const info = document.createElement('div');
                info.className = 'product-info';
                for (const [tag, className, value] of [
                    ['span', 'product-badge', producto.etiqueta || ''],
                    ['h3', '', producto.nombre || ''],
                    ['p', '', producto.descripcion || 'Descripción no disponible'],
                    ['span', 'product-price', 'ARS ' + new Intl.NumberFormat('es-AR').format(Number(producto.precio) || 0)]
                ]) {
                    const element = document.createElement(tag);
                    element.className = className;
                    element.textContent = String(value);
                    info.append(element);
                }
                card.append(image, info);
                grid.append(card);
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        fetchProductos();
    </script>
    <div id="toast" class="toast"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Verdu - Frutas y Verduras</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fffff0;
            font-family: 'Georgia', serif;
        }
        .btn-carton {
            background-color: #8b4513;
            color: white;
            border-radius: 0.375rem;
            transition: background-color 0.3s;
        }
        .btn-carton:hover {
            background-color: #6b3a1e;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <header class="bg-green-900 text-white sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between items-center p-4">
            <h1 class="text-xl font-bold">La Verdu</h1>
            <div id="carrito-contador" class="text-right">
                Carrito: <span id="contador-carrito">0</span> items
            </div>
        </div>
    </header>
    
    <main class="flex-grow">
        <section class="text-center py-8 bg-green-100">
            <h2 class="text-3xl font-bold mb-2">Sabor natural, como antes</h2>
            <p class="text-green-900">Tu verdulería de confianza, sin conservantes.</p>
        </section>
        
        <section class="p-4">
            <div class="container mx-auto">
                <input type="text" id="buscador" placeholder="Buscar productos..." class="w-full p-4 text-lg rounded-lg border-2 border-green-800 focus:outline-none focus:ring-2 focus:ring-green-600">
            </div>
        </section>
        
        <section class="p-4">
            <div id="productos" class="container mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </section>
    </main>

    <footer class="bg-green-900 text-white text-center py-4">
        <p>© 2023 La Verdu. Todos los derechos reservados.</p>
    </footer>

    <script>
        const EMPRESA_ID = 5;
        const SLUG = 'laverdu';
        
        let productos = [];
        let carrito = JSON.parse(localStorage.getItem('carrito')) || [];

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(`/api/public/catalog/${EMPRESA_ID}`);
                productos = await response.json();
                renderProductos(productos);
            } catch (error) {
                console.error('Error al cargar los productos:', error);
            }

            document.getElementById('buscador').addEventListener('input', (event) => {
                const filtro = event.target.value.toLowerCase();
                const productosFiltrados = productos.filter(p => p.nombre.toLowerCase().includes(filtro));
                renderProductos(productosFiltrados);
            });
        });

        function renderProductos(lista) {
            const contenedor = document.getElementById('productos');
            contenedor.innerHTML = '';
            
            lista.forEach(producto => {
                const productoDiv = document.createElement('div');
                productoDiv.className = 'bg-white rounded-lg shadow hover:shadow-lg transition-shadow p-4';
                
                const imagen = producto.imagen || 'https://via.placeholder.com/150';
                const precio = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(producto.precio);

                productoDiv.innerHTML = `
                    <img src="${imagen}" alt="${producto.nombre}" class="w-full h-48 object-cover mb-4 rounded-lg">
                    <h3 class="text-lg font-bold text-green-900">${producto.nombre}</h3>
                    <p class="text-sm text-green-700 mb-2">${producto.descripcion}</p>
                    <p class="text-lg font-bold text-green-800 mb-4">${precio}</p>
                    <button onclick="agregar(${producto.id})" class="btn-carton w-full p-2">Agregar</button>
                `;
                contenedor.appendChild(productoDiv);
            });
        }

        function agregar(id) {
            const producto = productos.find(p => p.id === id);
            const itemCarrito = carrito.find(item => item.id === id);
            
            if (itemCarrito) {
                itemCarrito.cantidad++;
            } else {
                carrito.push({ ...producto, cantidad: 1 });
            }
            
            localStorage.setItem('carrito', JSON.stringify(carrito));
            actualizarContadorCarrito();
        }

        function restar(id) {
            const itemCarrito = carrito.find(item => item.id === id);
            if (itemCarrito) {
                itemCarrito.cantidad--;
                if (itemCarrito.cantidad <= 0) {
                    carrito = carrito.filter(item => item.id !== id);
                }
            }
            
            localStorage.setItem('carrito', JSON.stringify(carrito));
            actualizarContadorCarrito();
        }

        function actualizarContadorCarrito() {
            const contador = carrito.reduce((total, item) => total + item.cantidad, 0);
            document.getElementById('contador-carrito').textContent = contador;
        }
        
        async function finalizarCompra() {
            const nombre = prompt('Ingresa tu nombre:');
            const telefono = prompt('Ingresa tu teléfono:');
            const direccion = prompt('Ingresa tu dirección:');
            
            try {
                const response = await fetch('/api/public/pedidos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        empresa_id: EMPRESA_ID,
                        cliente: nombre,
                        telefono: telefono,
                        direccion: direccion,
                        items: carrito.map(item => ({ producto: item.id, cantidad: item.cantidad, precio_unitario: item.precio })),
                        metodo_pago: 'efectivo'
                    })
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    alert('Pedido enviado, te contactaremos por WhatsApp');
                    carrito = [];
                    localStorage.removeItem('carrito');
                    actualizarContadorCarrito();
                } else {
                    alert('Error al enviar el pedido');
                }
            } catch (error) {
                console.error('Error al realizar el pedido:', error);
                alert('Error de red, intenta nuevamente');
            }
        }
    </script>
</body>
</html>

services:
  - type: web
    name: pedivoy-web-staging
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: pedivoy-db-staging
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ENABLE_WPP
        value: 0
      - key: CRON_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://pedivoy-web-staging.onrender.com
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

databases:
  - name: pedivoy-db-staging
    plan: starter
    postgresMajorVersion: 16

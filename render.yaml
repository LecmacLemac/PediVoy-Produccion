services:
  - type: web
    name: pedivoy-web-staging
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: which pdftoppm && npm ci --omit=dev
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: pedivoy-db-staging
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ENABLE_WPP
        value: 0
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: CRON_SECRET
        generateValue: true
      - key: ARCA_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://pedivoy-web-staging.onrender.com
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: WHATSAPP_CLOUD_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_CLOUD_LOG_PAYLOAD
        value: "0"

  - type: worker
    name: pedivoy-whatsapp-cloud-worker-staging
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: which pdftoppm && npm ci --omit=dev
    startCommand: npm run worker:whatsapp-cloud
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pedivoy-db-staging
          property: connectionString
      - key: ARCA_TOKEN_ENCRYPTION_KEY
        fromService:
          type: web
          name: pedivoy-web-staging
          envVarKey: ARCA_TOKEN_ENCRYPTION_KEY
      - key: WHATSAPP_GRAPH_VERSION
        value: v26.0
      - key: WHATSAPP_CLOUD_POLL_MS
        value: "1000"
      - key: WHATSAPP_CLOUD_LEASE_MS
        value: "120000"
      - key: WHATSAPP_CLOUD_TIMEOUT_MS
        value: "8000"
      - key: WHATSAPP_CLOUD_CANCEL_TIMEOUT_MS
        value: "100"
      - key: WHATSAPP_CLOUD_SHUTDOWN_MS
        value: "10000"

databases:
  - name: pedivoy-db-staging
    plan: starter
    postgresMajorVersion: "16"

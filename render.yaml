services:
  - type: web
    name: pedivoy-web-staging
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: which pdftoppm && npm ci --omit=dev
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: pedivoy-db-staging
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ENABLE_WPP
        value: 0
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: CRON_SECRET
        generateValue: true
      - key: ARCA_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://pedivoy-web-staging.onrender.com
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: WHATSAPP_CLOUD_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_CLOUD_LOG_PAYLOAD
        value: "0"

databases:
  - name: pedivoy-db-staging
    plan: starter
    postgresMajorVersion: 16
